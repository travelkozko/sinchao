<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Синь Чао — гид по Вьетнаму</title>
<meta name="theme-color" content="#F3E3CC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Rubik:wght@400;500;700&display=swap">
<link rel="preload" as="image" href="media/poster.jpg?b=202611011500">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --paper:#F3E3CC; --water:#21838C; --navy:#1F2A44; --pink:#C8285A; --sun:#F6C343;
  --st:max(env(safe-area-inset-top), calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)));
  --sb:max(env(safe-area-inset-bottom), calc(var(--tg-safe-area-inset-bottom, 0px) + var(--tg-content-safe-area-inset-bottom, 0px)));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-tap-highlight-color:transparent;height:100%}
body{
  margin:0;min-height:100%;overflow:hidden;
  background:var(--water);color:var(--navy);
  font-family:Rubik,system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}

/* ---------- Заставка ---------- */
#splash{position:fixed;inset:0;overflow:hidden;background:linear-gradient(to bottom, var(--paper) 0 44%, var(--water) 44%)}
/* сцена 9:16 по ширине экрана: на длинных телефонах снизу продолжается вода,
   на широких экранах снизу обрезается вода, а солнце и лодка остаются */
#stage{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:min(100vw, calc(100vh * 0.5625));aspect-ratio:9/16;
  container-type:inline-size;
  background:var(--paper) url("media/poster.jpg?b=202611011500") center/cover no-repeat;
}
#stage.end{background-image:url("media/end.jpg?b=202611011500")}
#stage::after{ /* мягкий переход видео в воду под ним */
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:9%;
  background:linear-gradient(to bottom, rgba(33,131,140,0), var(--water));pointer-events:none;
}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.01;pointer-events:none}
#video.on{opacity:1}

/* логотип справа от солнца, ниже шапки Telegram */
#logo{
  position:absolute;right:6%;left:52%;
  top:max(calc(var(--st) + 10px), 12%);
  display:flex;flex-direction:column;align-items:flex-end;text-align:right;
  opacity:0;transform:translateY(2cqw);
  transition:opacity .7s ease, transform .9s cubic-bezier(.2,.8,.2,1);
}
#logo.show{opacity:1;transform:none}
#logo h1{
  margin:0;font-family:Unbounded,sans-serif;font-weight:800;
  font-size:11.5cqw;line-height:.98;letter-spacing:-.01em;color:var(--navy);
  text-shadow:2.4cqw 1.6cqw 0 rgba(200,40,90,0);
  transition:text-shadow 1.1s cubic-bezier(.2,.8,.2,1) .15s;
}
#logo.show h1{text-shadow:.7cqw .5cqw 0 rgba(200,40,90,.55)}
#logo p{
  margin:2.4cqw 0 0;font-size:3.3cqw;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--navy);
}

/* нижние кнопки */
.bottom{
  position:fixed;left:50%;transform:translateX(-50%);
  width:min(calc(100vw - 40px), 420px, calc(100vh * 0.5625 - 40px));
  bottom:calc(var(--sb) + 22px);
}
#open{
  width:100%;height:58px;border:2px solid var(--navy);border-radius:0;
  background:var(--paper);color:var(--navy);
  font-family:Unbounded,sans-serif;font-weight:800;font-size:17px;letter-spacing:.02em;
  box-shadow:5px 5px 0 var(--pink);
  opacity:0;transform:translateY(12px);pointer-events:none;
  transition:opacity .5s ease, transform .6s cubic-bezier(.2,.8,.2,1), box-shadow .12s ease;
}
#open.show{opacity:1;transform:none;pointer-events:auto}
#open:active{box-shadow:2px 2px 0 var(--pink);transform:translate(3px,3px)}
#skip{
  display:block;margin:0 auto;height:44px;padding:0 18px;border:0;background:transparent;
  color:var(--paper);font-size:14px;font-weight:500;letter-spacing:.06em;opacity:.85;
}
#tap{
  position:fixed;inset:0;border:0;background:transparent;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:calc(var(--sb) + 40px);
  color:var(--paper);font-size:16px;font-weight:700;letter-spacing:.04em;
}

/* ---------- Временная заглушка главного экрана ---------- */
#guide{
  position:fixed;inset:0;background:var(--paper);
  padding:calc(var(--st) + 24px) 24px calc(var(--sb) + 24px);
  display:flex;flex-direction:column;gap:12px;
}
#guide h2{margin:0;font-family:Unbounded,sans-serif;font-weight:800;font-size:28px;color:var(--pink)}
#guide p{margin:0;font-size:16px;line-height:1.45}
#back{align-self:flex-start;height:44px;padding:0 16px;border:2px solid var(--navy);background:transparent;color:var(--navy);font-weight:700}
</style>
</head>
<body>

<section id="splash" aria-label="Заставка">
  <div id="stage">
    <video id="video" muted playsinline webkit-playsinline preload="auto"
           poster="media/poster.jpg?b=202611011500" aria-hidden="true"></video>
    <div id="logo">
      <h1>СИНЬ<br>ЧАО</h1>
      <p>гид по Вьетнаму</p>
    </div>
  </div>
  <div class="bottom">
    <button id="open" type="button">Открыть гид</button>
    <button id="skip" type="button" hidden>Пропустить</button>
  </div>
  <button id="tap" type="button" hidden>Нажмите, чтобы начать</button>
</section>

<section id="guide" hidden aria-label="Главный экран">
  <h2>Синь Чао</h2>
  <p>Здесь будет главный экран: «Сегодня», карта мест, еда, маршруты, практичное, разговорник и афиша.</p>
  <button id="back" type="button" hidden>← Назад</button>
</section>

<script>
(function(){
  var B = '?b=202611011500';
  var KEY = 'sinchao_intro_v1';
  var tg = window.Telegram && window.Telegram.WebApp;
  var inTg = !!(tg && tg.initData);

  // --- Telegram ---
  if (tg) {
    try { tg.ready(); tg.expand(); } catch(e){}
    try {
      if (/android|ios/.test(tg.platform) && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')) tg.requestFullscreen();
    } catch(e){}
    try { if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } catch(e){}
    try { if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.1')) { tg.setHeaderColor('#F3E3CC'); tg.setBackgroundColor('#21838C'); } } catch(e){}
  }
  function haptic(kind){
    try { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(kind || 'light'); } catch(e){}
  }

  var stage = document.getElementById('stage');
  var video = document.getElementById('video');
  var logo = document.getElementById('logo');
  var openBtn = document.getElementById('open');
  var skipBtn = document.getElementById('skip');
  var tapBtn = document.getElementById('tap');
  var splash = document.getElementById('splash');
  var guide = document.getElementById('guide');
  var backBtn = document.getElementById('back');
  var finished = false;

  function seen(){ try { return localStorage.getItem(KEY) === '1'; } catch(e){ return false; } }
  function markSeen(){ try { localStorage.setItem(KEY, '1'); } catch(e){} }

  function showLogo(){ logo.classList.add('show'); }

  // Заставка закончилась: замираем на последнем кадре, показываем кнопку
  function finish(){
    if (finished) return;
    finished = true;
    stage.classList.add('end');
    skipBtn.hidden = true;
    tapBtn.hidden = true;
    showLogo();
    openBtn.classList.add('show');
    markSeen();
  }

  if (seen()) {
    // повторный запуск — без ролика, сразу последний кадр
    finish();
  } else {
    var started = false;
    video.src = 'media/splash.mp4' + B;
    video.muted = true;

    function start(){
      if (started) return;
      started = true;
      var p = video.play();
      if (p && p.catch) p.catch(function(){
        started = false;
        tapBtn.hidden = false;
      });
    }
    video.addEventListener('canplaythrough', start, { once: true });
    setTimeout(start, 3500);           // на медленной сети не ждём буфер бесконечно
    video.addEventListener('playing', function(){
      skipBtn.hidden = false;
      setTimeout(showLogo, 500);
    });
    // показываем видео только когда реально пошли первые кадры — под ним постер = первый кадр
    video.addEventListener('timeupdate', function(){
      if (!video.classList.contains('on') && video.currentTime > 0.04) video.classList.add('on');
    });
    video.addEventListener('ended', finish);
    video.addEventListener('error', finish);

    tapBtn.addEventListener('click', function(){
      tapBtn.hidden = true;
      start();
    });
    skipBtn.addEventListener('click', function(){
      haptic('light');
      try { video.pause(); } catch(e){}
      finish();
      video.classList.remove('on'); // остаётся картинка последнего кадра
    });
    // Android ставит видео на паузу при сворачивании — продолжаем, если ролик не доиграл
    document.addEventListener('visibilitychange', function(){
      if (!document.hidden && started && !finished && video.paused) video.play().catch(function(){});
    });
  }

  // --- Переход в гид и обратно ---
  function openGuide(){
    haptic('medium');
    splash.hidden = true;
    guide.hidden = false;
    if (inTg) tg.BackButton.show(); else backBtn.hidden = false;
  }
  function closeGuide(){
    haptic('light');
    guide.hidden = true;
    splash.hidden = false;
    if (inTg) tg.BackButton.hide(); else backBtn.hidden = true;
  }
  openBtn.addEventListener('click', openGuide);
  backBtn.addEventListener('click', closeGuide);
  if (inTg) tg.BackButton.onClick(closeGuide);
})();
</script>
</body>
</html>
