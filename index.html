<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Синь Чао — гид по Вьетнаму</title>
<meta name="theme-color" content="#FAE6C8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="preload" as="image" href="media/loop-first.jpg?b=202611011700">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --paper:#FAE6C8; --card:#FFFCF4; --ink:#2B2A28; --ink-soft:#5A554C; --clay:#C0533A; --sea:#7FB7BE; --ochre:#F0B85C; --note:#F9E08A;
  --st:max(env(safe-area-inset-top), calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)));
  --sb:max(env(safe-area-inset-bottom), calc(var(--tg-safe-area-inset-bottom, 0px) + var(--tg-content-safe-area-inset-bottom, 0px)));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-tap-highlight-color:transparent;height:100%}
body{
  margin:0;min-height:100%;overflow:hidden;
  background:var(--paper);color:var(--ink);
  font-family:Lora,Georgia,serif;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
a{color:var(--ink-soft)}
.hand{font-family:Caveat,cursive;font-weight:700}
.screen{position:fixed;inset:0;background:var(--paper)}

/* ---------- Заставка ---------- */
#splash{overflow:hidden}
/* сцена 9:14 по ширине экрана, снизу растворяется в бумаге */
#stage{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:min(100vw, calc((100vh - 215px) * 9 / 14));aspect-ratio:9/14;
  background:var(--paper) url("media/loop-first.jpg?b=202611011700") center/cover no-repeat;
}
#stage::after{ /* ножки табуретки уходят в бумагу, как в незаконченном наброске */
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:11%;
  background:linear-gradient(to bottom, rgba(250,230,200,0) 0%, rgba(250,230,200,.8) 60%, var(--paper) 100%);
  pointer-events:none;
}
#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.01;pointer-events:none}
#stage video.on{opacity:1}

/* нижний блок: название и кнопка на бумаге */
.bottom{
  position:fixed;left:50%;transform:translateX(-50%);
  width:min(calc(100vw - 44px), 420px, max(280px, calc((100vh - 215px) * 9 / 14 - 20px)));
  bottom:calc(var(--sb) + 22px);
  display:flex;flex-direction:column;align-items:stretch;
}
#logo{
  margin-bottom:22px;
  opacity:0;transform:translateY(10px);
  transition:opacity .8s ease, transform 1s cubic-bezier(.2,.8,.2,1);
}
#logo.show{opacity:1;transform:none}
#logo h1{margin:0;font-family:Caveat,cursive;font-weight:700;font-size:min(56px, 16vw);white-space:nowrap;line-height:.95;color:var(--ink)}
#logo svg{display:block;margin-top:2px}
#logo svg path{stroke-dasharray:240;stroke-dashoffset:240;transition:stroke-dashoffset 1.1s cubic-bezier(.4,.1,.2,1) .35s}
#logo.show svg path{stroke-dashoffset:0}
#logo p{margin:6px 0 0;font-size:15px;font-style:italic;color:var(--ink-soft)}

#open{
  width:100%;height:58px;border:1.5px solid var(--ink);border-radius:6px;
  background:var(--card);color:var(--ink);
  font-family:Caveat,cursive;font-weight:700;font-size:30px;line-height:1;
  box-shadow:3px 4px 0 rgba(43,42,40,.2);
  opacity:0;transform:translateY(10px) rotate(-.6deg);pointer-events:none;
  transition:opacity .5s ease, transform .6s cubic-bezier(.2,.8,.2,1), box-shadow .12s ease;
}
#open.show{opacity:1;transform:rotate(-.6deg);pointer-events:auto}
#open:active{box-shadow:1px 1px 0 rgba(43,42,40,.2);transform:translate(2px,3px) rotate(-.6deg)}
#tap{
  position:fixed;inset:0;border:0;background:transparent;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:calc(var(--sb) + 40px);
  color:var(--ink);font-family:Caveat,cursive;font-size:26px;font-weight:700;
}

/* ---------- Главный экран ---------- */
.lined{
  background-color:var(--paper);
  background-image:linear-gradient(rgba(43,42,40,.055) 1px, transparent 1px);
  background-size:100% 28px;
}
.scroll{
  position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(var(--st) + 14px) 0 calc(var(--sb) + 96px);
}
.wrap{max-width:480px;margin:0 auto;padding:0 22px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 12px}
.top h2{margin:0;font-family:Caveat,cursive;font-weight:700;font-size:min(46px, 13vw);line-height:.95;white-space:nowrap}
.top svg.underline{display:block;margin-top:1px}
.top .sub{display:block;margin-top:3px;font-size:13px;font-style:italic;color:var(--ink-soft)}
.city{
  flex:none;height:44px;padding:0 12px;border:1.5px dashed var(--ink);border-radius:8px;background:transparent;
  display:flex;align-items:center;gap:4px;font-family:Caveat,cursive;font-weight:700;font-size:23px;
}

.today{margin:24px 0 0;position:relative;transform:rotate(-1.1deg)}
.tape{position:absolute;left:50%;top:-12px;width:86px;height:24px;margin-left:-43px;background:rgba(214,190,130,.65);transform:rotate(2deg);z-index:1}
.today .card{background:var(--card);border:1.5px solid var(--ink);padding:18px 18px 14px;position:relative;overflow:hidden;min-height:176px}
.blob1{position:absolute;right:-26px;top:-22px;width:150px;height:120px;border-radius:58% 42% 63% 37% / 45% 55% 45% 55%;background:rgba(127,183,190,.42)}
.blob2{position:absolute;right:26px;top:16px;width:54px;height:54px;border-radius:52% 48% 55% 45% / 50% 46% 54% 50%;background:rgba(240,184,92,.75)}
.today .in{position:relative;display:flex;flex-direction:column;gap:4px}
.today .date{font-family:Caveat,cursive;font-weight:700;font-size:25px}
.temp-row{display:flex;align-items:center;gap:12px}
.temp{flex:none;font-family:Caveat,cursive;font-weight:700;font-size:62px;line-height:1;padding-right:6px}
.wtext{flex:1;min-width:0;font-size:14px;line-height:1.35}
.facts{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:#4A463F}
.facts span[hidden]{display:none}
.updated{margin-top:8px;font-size:11px;color:var(--ink-soft);font-style:italic}
.updated a{color:var(--ink-soft)}

.phrase{
  display:block;margin:22px 0 0 auto;width:min(260px, 78%);text-align:left;
  transform:rotate(1.4deg);background:var(--note);border:0;padding:12px 14px;
  box-shadow:2px 3px 0 rgba(43,42,40,.18);
}
.phrase small{display:block;font-size:12px;font-style:italic;color:#4A463F}
.phrase b{display:block;font-family:Caveat,cursive;font-weight:700;font-size:30px;line-height:1.05;margin:2px 0}
.phrase span{font-size:13px}

.grid{margin:20px 0 0;display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));column-gap:18px}
.grid button{
  height:56px;border:0;border-bottom:1.5px dashed #8C8475;background:transparent;
  display:flex;align-items:center;gap:10px;padding:0;text-align:left;
  font-family:Caveat,cursive;font-weight:700;font-size:24px;white-space:nowrap;
}
.grid svg, .tabs svg, .row svg{flex:none}

.tabs{
  position:absolute;left:0;right:0;bottom:0;z-index:5;
  border-top:1.5px solid var(--ink);background:var(--paper);
  padding:6px 10px calc(var(--sb) + 8px);
}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4, minmax(0, 1fr))}
.tabs button{
  height:48px;border:0;background:transparent;color:#4A463F;
  font-family:Caveat,cursive;font-weight:600;font-size:min(22px, 6vw);white-space:nowrap;
}
.tabs button[aria-current="page"]{
  color:var(--ink);font-weight:700;
  text-decoration:underline;text-decoration-color:var(--clay);text-decoration-thickness:3px;text-underline-offset:5px;
}

/* ---------- Внутренние экраны и листы ---------- */
.page h2{margin:0 0 10px;font-family:Caveat,cursive;font-weight:700;font-size:44px;line-height:1}
.page p{margin:0 0 12px;font-size:16px;line-height:1.5}
.soon{margin-top:18px;padding:14px 16px;border:1.5px dashed var(--ink);border-radius:8px;transform:rotate(-.5deg);font-size:15px;line-height:1.45}
.list{margin-top:10px}
.row{
  width:100%;min-height:56px;border:0;border-bottom:1.5px dashed #8C8475;background:transparent;
  display:flex;align-items:center;gap:12px;padding:8px 0;text-align:left;font-size:16px;
}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-family:Caveat,cursive;font-weight:700;font-size:24px;line-height:1.1}
.row .t small{display:block;font-size:13px;color:var(--ink-soft);font-style:italic}
.row .mark{font-size:13px;font-style:italic;color:var(--ink-soft)}
.fallback-back{margin-top:22px;height:44px;padding:0 16px;border:1.5px dashed var(--ink);border-radius:8px;background:transparent;font-family:Caveat,cursive;font-size:22px;font-weight:700}

/* ---------- Разговорник ---------- */
/* ---------- Практичное ---------- */
.pr{margin:14px 0 0;background:var(--card);border:1.5px solid var(--ink);box-shadow:2px 3px 0 rgba(43,42,40,.12)}
.pr:nth-child(odd){transform:rotate(-.4deg)}
.pr:nth-child(even){transform:rotate(.35deg)}
.pr summary{list-style:none;cursor:pointer;min-height:54px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:Caveat,cursive;font-weight:700;font-size:27px}
.pr summary::-webkit-details-marker{display:none}
.pr summary svg{transition:transform .2s ease}
.pr[open] summary svg{transform:rotate(90deg)}
.pr ul{margin:0;padding:0 16px 6px 16px;list-style:none}
.pr li{padding:9px 0;border-top:1.5px dashed #CFC6B5;font-size:15px;line-height:1.5}
.pr li b{font-weight:600}
.pr .links{padding:4px 16px 14px;display:flex;flex-direction:column;gap:8px}
.pr .links button{align-self:flex-start;min-height:40px;padding:6px 12px;border:1.5px dashed var(--ink);border-radius:8px;background:transparent;font-size:14px;text-align:left}
.checked{margin:4px 0 0;font-size:13px;font-style:italic;color:var(--ink-soft)}
.search{display:block;width:100%;height:46px;margin:6px 0 12px;padding:0 14px;border:1.5px solid var(--ink);border-radius:8px;background:var(--card);font:16px Lora,Georgia,serif;color:var(--ink);-webkit-user-select:text;user-select:text}
.search::placeholder{color:#7A7366;font-style:italic}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -22px;padding:2px 22px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 14px;border:1.5px dashed var(--ink);border-radius:20px;background:transparent;font-family:Caveat,cursive;font-weight:700;font-size:21px;white-space:nowrap}
.chip[aria-pressed="true"]{border-style:solid;background:var(--ink);color:var(--paper)}
.pb-h{margin:18px 0 2px;font-family:Caveat,cursive;font-weight:700;font-size:28px;color:var(--clay)}
.ph{width:100%;min-height:58px;border:0;border-bottom:1.5px dashed #8C8475;background:transparent;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding:8px 0;text-align:left}
.ph b{font-size:18px;font-weight:600;line-height:1.25}
.ph span{font-size:14px;color:var(--ink-soft)}
.ph span i{color:var(--ink)}
.pb-note{margin:18px 0 0;font-size:13px;font-style:italic;color:var(--ink-soft);line-height:1.45}
.pb-sos{margin-top:14px;padding:12px 14px;background:var(--note);box-shadow:2px 3px 0 rgba(43,42,40,.18);transform:rotate(-.6deg);font-size:14px;line-height:1.45}
.empty{margin-top:18px;font-style:italic;color:var(--ink-soft)}
.say{min-height:calc(100vh - var(--st) - var(--sb) - 140px);display:flex;flex-direction:column;justify-content:center;gap:18px}
.say .card{background:var(--card);border:1.5px solid var(--ink);padding:26px 20px;transform:rotate(-.6deg);box-shadow:3px 4px 0 rgba(43,42,40,.15)}
.say .vi{font-size:clamp(34px, 11vw, 54px);font-weight:600;line-height:1.15;word-wrap:break-word}
.say .tr{margin-top:14px;font-family:Caveat,cursive;font-weight:700;font-size:28px;color:var(--clay)}
.say .ru{margin-top:4px;font-size:17px}
.say .hint{font-size:13px;font-style:italic;color:var(--ink-soft);text-align:center}
.drv-label{font-size:16px;color:var(--ink);margin-bottom:6px;line-height:1.35}
.drv-label span{font-weight:600}
.drv-label i{display:block;font-size:13px;color:var(--ink-soft)}
.drv-addr{margin-top:14px;font-size:clamp(22px, 6.5vw, 30px);font-weight:600;line-height:1.3}
.drv-ll{margin-top:10px;font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.drv-acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.speak{align-self:center;height:50px;padding:0 22px;border:1.5px solid var(--ink);border-radius:25px;background:var(--card);display:flex;align-items:center;gap:8px;font-family:Caveat,cursive;font-weight:700;font-size:24px}

/* ---------- Карта мест ---------- */
#mapScr{background:#EFE6D2}
#map{position:absolute;inset:0}
#map canvas{filter:sepia(.28) saturate(.85) brightness(1.02)}
.map-top{position:absolute;left:0;right:0;top:0;z-index:3;padding:calc(var(--st) + 8px) 0 8px;background:linear-gradient(to bottom, rgba(250,230,200,.96) 70%, rgba(250,230,200,0))}
.map-top .chips{margin:0;padding:2px 14px 6px}
.map-top .chip{background:rgba(255,252,244,.9)}
.map-top .chip[aria-pressed="true"]{background:var(--ink)}
.locate{position:absolute;right:14px;z-index:3;bottom:calc(var(--sb) + 22px);width:48px;height:48px;border-radius:24px;border:1.5px solid var(--ink);background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:2px 3px 0 rgba(43,42,40,.18)}
.pin{width:30px;height:38px;cursor:pointer}
.pin svg{display:block;filter:drop-shadow(1px 2px 0 rgba(43,42,40,.25))}
.pin.sel svg{transform:scale(1.25);transform-origin:50% 100%}
.me{width:16px;height:16px;border-radius:8px;background:#2F6B72;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,107,114,.25)}
.sheet{position:absolute;left:10px;right:10px;z-index:4;bottom:calc(var(--sb) + 10px);max-width:480px;margin:0 auto;max-height:62vh;overflow-y:auto;background:var(--card);border:1.5px solid var(--ink);box-shadow:3px 4px 0 rgba(43,42,40,.2);padding:14px 16px 14px;transform:rotate(-.4deg)}
.sheet .ph-wrap{margin:-14px -16px 12px;position:relative;background:#E8DFCC}
.sheet .ph-wrap img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.sheet .ph-cap{display:block;padding:4px 16px 0;font-size:10px;line-height:1.35;color:var(--ink-soft);font-style:italic}
.sheet .ph-cap a{color:var(--ink-soft)}
.sheet .ph-wrap + .x, .sheet .x.on-photo{background:rgba(255,252,244,.92);border-radius:22px}
.sheet .x{position:absolute;right:6px;top:6px;z-index:2;width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.sheet h3{margin:0 40px 0 0;font-family:Caveat,cursive;font-weight:700;font-size:32px;line-height:1.05}
.sheet .vi{font-size:14px;color:var(--ink-soft);margin-top:2px}
.sheet .meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:#4A463F}
.badge{display:inline-block;font-size:12px;font-style:italic;padding:2px 8px;border:1.5px solid var(--clay);color:var(--clay);border-radius:12px}
.badge.trav{border-color:#2F6B72;color:#2F6B72}
.badge.open{border-color:#8C8475;color:#5A554C}
.badge.stale{border-color:#B07A1E;color:#8A5A13}
.sheet .short{margin:10px 0 0;font-size:15px;line-height:1.45}
.sheet .addr{margin:8px 0 0;font-size:13px;color:#4A463F;padding-left:20px;position:relative}
.sheet .addr::before{content:'';position:absolute;left:2px;top:3px;width:11px;height:11px;border:2px solid var(--clay);border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.tipnote{margin:12px 0 0;padding:10px 12px;background:var(--note);transform:rotate(.6deg);box-shadow:2px 2px 0 rgba(43,42,40,.15)}
.tipnote small{display:block;font-size:12px;font-style:italic;color:#4A463F}
.tipnote span{font-family:Caveat,cursive;font-weight:700;font-size:22px;line-height:1.2}
.sheet .acts{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.sheet .acts button{min-height:44px;padding:0 14px;border:1.5px solid var(--ink);border-radius:8px;background:transparent;font-family:Caveat,cursive;font-weight:700;font-size:21px}
.map-empty{position:absolute;left:16px;right:16px;z-index:3;bottom:calc(var(--sb) + 84px);max-width:420px;margin:0 auto;padding:12px 14px;background:var(--note);box-shadow:2px 3px 0 rgba(43,42,40,.18);transform:rotate(-.8deg);font-size:14px;line-height:1.45}
.map-fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;font-style:italic;color:var(--ink-soft)}
.maplibregl-ctrl-attrib{font-size:10px}

/* ---------- Еда ---------- */
.fd-h{margin:20px 0 4px;font-family:Caveat,cursive;font-weight:700;font-size:28px;color:var(--clay)}
.fd-row{width:100%;min-height:84px;border:0;border-bottom:1.5px dashed #8C8475;background:transparent;display:flex;align-items:center;gap:14px;padding:8px 0;text-align:left}
.fd-ill{flex:none;width:68px;height:68px;border-radius:50%;background:#F3E3C6;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fd-ill img{width:100%;height:100%;object-fit:cover}
.fd-t{flex:1;min-width:0}
.fd-t b{display:block;font-family:Caveat,cursive;font-weight:700;font-size:25px;line-height:1.05}
.fd-t span{display:block;font-size:14px}
.fd-t small{display:block;font-size:13px;color:var(--ink-soft);font-style:italic}
.chili{display:inline-flex;gap:1px;vertical-align:-3px}
.fd-top{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.fd-top .fd-ill{width:96px;height:96px}
.fd-top h2{margin:0;font-size:40px}
.fd-vi{font-size:22px;font-weight:600;margin-top:2px}
.fd-pron{font-family:Caveat,cursive;font-weight:700;font-size:24px;color:var(--clay)}
.fd-meta{margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;align-items:center}
.fd-photo{margin:16px 0 0;background:var(--card);border:1.5px solid var(--ink);padding:8px 8px 6px;transform:rotate(.6deg);box-shadow:2px 3px 0 rgba(43,42,40,.15)}
.fd-photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.fd-photo small{display:block;margin-top:4px;font-size:10px;color:var(--ink-soft);font-style:italic}
.fd-photo small a{color:var(--ink-soft)}
.fd-contains{margin:14px 0 0;font-size:14px;line-height:1.5}
.fd-acts{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px}
.fd-acts button{min-height:48px;padding:0 16px;border:1.5px solid var(--ink);border-radius:8px;background:var(--card);font-family:Caveat,cursive;font-weight:700;font-size:23px}
.toggle{display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px}
.toggle input{width:22px;height:22px;accent-color:var(--clay)}
.ord-extra{margin-top:10px;font-size:clamp(24px, 7vw, 32px);font-weight:600;color:var(--clay)}
</style>
</head>
<body>

<!-- ===== Заставка ===== -->
<section id="splash" class="screen" aria-label="Заставка">
  <div id="stage">
    <video id="loop" muted playsinline webkit-playsinline loop preload="auto"
           poster="media/loop-first.jpg?b=202611011700" aria-hidden="true"></video>
  </div>
  <div class="bottom">
    <div id="logo">
      <h1>Синь Чао!</h1>
      <svg aria-hidden="true" width="210" height="14" viewBox="0 0 210 14"><path d="M3 9 C55 3, 120 13, 206 5" fill="none" stroke="#C0533A" stroke-width="3.2" stroke-linecap="round"/></svg>
      <p>путевые заметки по Вьетнаму</p>
    </div>
    <div id="btns">
      <button id="open" type="button">Открыть гид</button>
    </div>
  </div>

<script>
(function(){
  var B = '?b=202611011700';
  var BUILD = '202611012110';
  var CITY = { id:'nha-trang', name:'Нячанг', lat:12.2388, lon:109.1967, seaLat:12.24, seaLon:109.22, tz:'Asia/Ho_Chi_Minh' };

  var tg = window.Telegram && window.Telegram.WebApp;
  var inTg = !!(tg && tg.initData);

  // --- Telegram ---
  if (tg) {
    try { tg.ready(); tg.expand(); } catch(e){}
    try {
      if (/android|ios/.test(tg.platform) && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')) tg.requestFullscreen();
    } catch(e){}
    try { if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } catch(e){}
    try { if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.1')) { tg.setHeaderColor('#FAE6C8'); tg.setBackgroundColor('#FAE6C8'); } } catch(e){}
  }
  function haptic(kind){
    try { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(kind || 'light'); } catch(e){}
  }
  function $(id){ return document.getElementById(id); }
  function store(k, v){ try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch(e){ return null; } }
  function openLink(url){ try { if (tg && tg.openLink) { tg.openLink(url); return; } } catch(e){} window.open(url, '_blank', 'noopener'); }

  // ================= Заставка =================
  var loopV = $('loop'), logo = $('logo'), openBtn = $('open'), tapBtn = $('tap'), splash = $('splash');
  loopV.src = 'media/loop.mp4' + B;
  loopV.muted = true;
  var started = false, shown = false;

  function showUi(){
    if (shown) return;
    shown = true;
    setTimeout(function(){ logo.classList.add('show'); }, 400);
    setTimeout(function(){ openBtn.classList.add('show'); }, 1100);
  }
  function play(){
    var p = loopV.play();
    if (p && p.catch) p.catch(function(){ started = false; tapBtn.hidden = false; });
  }
  function start(){ if (started) return; started = true; play(); }
  loopV.addEventListener('canplaythrough', start, { once: true });
  setTimeout(start, 3500);              // на медленной сети не ждём буфер бесконечно
  setTimeout(showUi, 2500);             // кнопка появится, даже если видео грузится долго
  loopV.addEventListener('playing', showUi);
  loopV.addEventListener('timeupdate', function(){
    if (!loopV.classList.contains('on') && loopV.currentTime > 0.04) loopV.classList.add('on');
  });
  loopV.addEventListener('error', showUi);
  tapBtn.addEventListener('click', function(){ tapBtn.hidden = true; started = true; play(); showUi(); });

  // ================= Навигация =================
  // стек экранов: заставка → главный → внутренний; «Назад» — родная кнопка Telegram
  var stack = ['splash'];
  var screens = { splash: splash, home: $('home'), page: $('page'), map: $('mapScr') };

  function render(){
    var top = stack[stack.length - 1];
    var screenId = top === 'splash' || top === 'home' || top === 'map' ? top : 'page';
    Object.keys(screens).forEach(function(k){ screens[k].hidden = (k !== screenId); });
    if (screenId === 'page') renderPage(top);
    if (top === 'splash') { if (started) loopV.play().catch(function(){}); }
    else { try { loopV.pause(); } catch(e){} }
    var canBack = stack.length > 1;
    if (inTg) { try { canBack ? tg.BackButton.show() : tg.BackButton.hide(); } catch(e){} }
    if (top === 'home') loadToday();
    if (top === 'map') openMap();
    maybeReload();
  }
  function go(id){
    haptic('light');
    if (stack[stack.length - 1] === 'phrasebook') pbState.scroll = $('page').querySelector('.scroll').scrollTop;
    if (stack[stack.length - 1] === 'food') foodScroll = $('page').querySelector('.scroll').scrollTop;
    stack.push(id); render();
  }
  function back(){ if (stack.length < 2) return; haptic('light'); stack.pop(); render(); }
  if (inTg) tg.BackButton.onClick(back);
  document.addEventListener('input', function(e){
    if (e.target.id === 'pbSearch') { pbState.q = e.target.value; $('pbList').innerHTML = pbListHtml(); }
  });

  openBtn.addEventListener('click', function(){ haptic('medium'); stack = ['splash', 'home']; render(); });
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-go]');
    if (b) { go(b.getAttribute('data-go')); return; }
    var l = e.target.closest('[data-link]');
    if (l) { e.preventDefault(); openLink(l.getAttribute('data-link')); return; }
    var a = e.target.closest('[data-act]');
    if (a && a.getAttribute('data-act') === 'home-screen') { haptic('light'); try { tg.addToHomeScreen(); } catch(err){} }
    if (a && a.getAttribute('data-act') === 'back') back();
    if (a && a.getAttribute('data-act') === 'speak') { var t = stack[stack.length - 1]; var ph = ALL[+t.slice(4)]; if (ph) { haptic('light'); speak(ph[0]); } }
    var ch = e.target.closest('[data-cat]');
    if (ch) { haptic('light'); pbState.cat = ch.getAttribute('data-cat'); pbState.scroll = 0;
      Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(x){ x.setAttribute('aria-pressed', String(x === ch)); });
      $('pbList').innerHTML = pbListHtml(); }
  });

  // ================= Внутренние экраны =================
  var PAGES = {
    map:        { title:'Карта мест', text:'Пляжи, кафе, рынки, смотровые и мои проверенные места — на одной карте, с фильтрами и маршрутом от вас.' },
    food:       { title:'Еда', text:'Что попробовать во Вьетнаме, как это называется в меню и где это готовят вкусно.' },
    routes:     { title:'Маршруты', text:'Готовые прогулки и поездки на день: по городу, к водопадам, по островам.' },
    practical:  { title:'Практичное', text:'Деньги и обмен, въезд и визы, связь и интернет, такси и байки — коротко и по делу.' },
    phrasebook: { title:'Разговорник', text:'Главные фразы с русским произношением: в кафе, на рынке, в такси.' },
    events:     { title:'Афиша', text:'Праздники, фестивали, концерты и события в городе на ближайшие дни.' }
  };
  var CITIES = [
    { name:'Нячанг', on:true },
    { name:'Дананг и Хойан' }, { name:'Далат' }, { name:'Фукуок' }, { name:'Хошимин' }, { name:'Ханой' }
  ];

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var PR = null;   // данные раздела «Практичное»
  // **жирный** в тексте данных → <b>, всё остальное экранируется
  function rich(t){ return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
  var fallbackBack = inTg ? '' : '<button class="fallback-back" type="button" data-act="back">← назад</button>';

  function renderPage(id){
    var body = $('pageBody'), html = '';
    if (PAGES[id] && id !== 'phrasebook' && id !== 'practical' && id !== 'map' && id !== 'food') {
      var p = PAGES[id];
      html = '<h2>' + esc(p.title) + '</h2><p>' + esc(p.text) + '</p>' +
             '<div class="soon">Раздел готовим. Загляните чуть позже — новые разделы появятся здесь сами, ничего обновлять не нужно.</div>';
    } else if (id === 'phrasebook') {
      var cats = [{ id:'all', title:'Все' }].concat(PB ? PB.categories : []);
      html = '<h2>Разговорник</h2>' +
        '<input class="search" id="pbSearch" type="search" inputmode="search" autocomplete="off" placeholder="Найти: кофе, такси, сколько…" aria-label="Поиск по разговорнику" value="' + esc(pbState.q) + '">' +
        '<div class="chips" role="group" aria-label="Темы">' + cats.map(function(c){
          return '<button class="chip" type="button" data-cat="' + c.id + '" aria-pressed="' + (pbState.cat === c.id) + '">' + esc(c.title) + '</button>';
        }).join('') + '</div>' +
        '<div id="pbList">' + pbListHtml() + '</div>' +
        (PB ? '<div class="pb-sos">' + esc(PB.emergency) + '</div><p class="pb-note">' + esc(PB.note) + ' Нажмите на фразу, чтобы показать её крупно.</p>' : '');
      body.innerHTML = html + fallbackBack;
      body.parentNode.scrollTop = pbState.scroll || 0;
      return;
    } else if (id === 'practical') {
      if (!PR) {
        html = '<h2>Практичное</h2><p class="empty">Загружаем…</p>';
        getJSON('data/practical.json' + B, 10000).then(function(d){ PR = d; if (stack[stack.length - 1] === 'practical') renderPage('practical'); })
          .catch(function(){ if (stack[stack.length - 1] === 'practical') $('pageBody').innerHTML = '<h2>Практичное</h2><p class="empty">Нет связи. Откройте раздел, когда появится интернет.</p>' + fallbackBack; });
      } else {
        var chev = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B2A28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
        html = '<h2>Практичное</h2><p class="checked">Проверено: ' + esc(PR.checked) + ' · ' + esc(CITY.name) + '</p>' +
          PR.sections.map(function(sec, i){
            return '<details class="pr"' + (i === 0 ? ' open' : '') + '><summary>' + esc(sec.title) + chev + '</summary><ul>' +
              sec.items.map(function(t){ return '<li>' + rich(t) + '</li>'; }).join('') + '</ul>' +
              (sec.links && sec.links.length ? '<div class="links">' + sec.links.map(function(l){
                return '<button type="button" data-link="' + esc(l.url) + '">' + esc(l.t) + ' ↗</button>'; }).join('') + '</div>' : '') +
              '</details>';
          }).join('') +
          '<p class="pb-note">' + esc(PR.disclaimer) + '</p>';
      }
    } else if (id === 'driver') {
      var d = driverText || {};
      var title = d.nameVi || d.name || '';
      html = '<div class="say"><div class="card">' +
        '<div class="drv-label"><span lang="vi">Cho tôi đến</span> <i>«чо той дэн» — отвезите меня в</i></div>' +
        '<div class="vi" lang="vi">' + esc(title) + '</div>' +
        (d.addr ? '<div class="drv-addr" lang="vi">' + esc(d.addr) + '</div>' : '') +
        (d.nameVi && d.name ? '<div class="ru" style="margin-top:12px">' + esc(d.name) + '</div>' : '') +
        (d.lat ? '<div class="drv-ll">' + d.lat.toFixed(5) + ', ' + d.lon.toFixed(5) + '</div>' : '') + '</div>' +
        '<div class="drv-acts">' +
          (d.lat ? '<button type="button" class="speak" data-act="drv-maps">Открыть в Google Maps</button>' : '') +
          '<button type="button" class="speak" data-act="drv-copy">Скопировать адрес</button></div>' +
        '<div class="hint">покажите экран водителю</div></div>';
    } else if (id === 'food') {
      if (!FOOD) { html = '<h2>Еда</h2><p class="empty">Загружаем…</p>'; loadFood(); }
      else {
        html = '<h2>Еда</h2><p>Что попробовать и как это заказать. Нажмите на блюдо — там произношение и кнопка «Показать официанту».</p>' +
          FOOD.groups.map(function(g){
            var rows = FOOD.dishes.filter(function(d){ return d.group === g.id; }).map(function(d){
              return '<button class="fd-row" type="button" data-go="dish:' + d.id + '">' + illHtml(d) +
                '<span class="fd-t"><b>' + esc(d.ru) + '</b><span lang="vi">' + esc(d.vi) + '</span>' +
                '<small>«' + esc(d.pron) + '»' + (d.spicy ? '<span style="white-space:nowrap"> · ' + chili(d.spicy) + '</span>' : '') + '</small></span></button>';
            }).join('');
            return rows ? '<div class="fd-h">' + esc(g.title) + '</div>' + rows : '';
          }).join('') +
          '<p class="pb-note">' + esc(FOOD.spicyNote) + ' ' + esc(FOOD.note) + '</p>';
        body.innerHTML = html + fallbackBack;
        body.parentNode.scrollTop = foodScroll || 0;
        return;
      }
    } else if (/^dish:/.test(id)) {
      var d = FOOD && FOOD.dishes.filter(function(x){ return x.id === id.slice(5); })[0];
      if (!d) { html = '<p class="empty">Загружаем…</p>'; loadFood(); }
      else {
        html = '<div class="fd-top">' + illHtml(d) + '<div><h2>' + esc(d.ru) + '</h2></div></div>' +
          '<div class="fd-vi" lang="vi">' + esc(d.vi) + '</div><div class="fd-pron">«' + esc(d.pron) + '»</div>' +
          '<div class="fd-meta"><span>' + (d.spicy ? chili(d.spicy) + ' ' + ['', 'чуть остро', 'остро', 'очень остро'][d.spicy] : 'не остро') + '</span>' +
            '<span>' + esc(d.price) + ' · ' + ['', 'недорого', 'средне', 'дорого'][d.price.length] + '</span></div>' +
          '<p style="margin-top:12px">' + esc(d.short) + '</p>' +
          (d.contains && d.contains.length ? '<p class="fd-contains"><b>Обычно в составе:</b> ' + esc(d.contains.join(', ')) + '.<br><small style="color:var(--ink-soft)">Рецепт в каждом кафе свой — при аллергии спросите.</small></p>' : '') +
          (d.photo ? '<figure class="fd-photo" style="margin-left:0;margin-right:0"><img src="' + esc(d.photo) + '" alt="' + esc(d.ru) + ' — фото" loading="lazy" decoding="async">' +
            '<small>Фото: ' + (d.creditUrl ? '<a href="#" data-link="' + esc(d.creditUrl) + '">' + esc(d.credit) + '</a>' : esc(d.credit)) + '</small></figure>' : '') +
          '<div class="fd-acts"><button type="button" data-go="order:' + d.id + '">Показать официанту</button>' +
            '<button type="button" data-act="food-near">Где поесть рядом</button></div>';
      }
    } else if (/^order:/.test(id)) {
      var o = FOOD && FOOD.dishes.filter(function(x){ return x.id === id.slice(6); })[0];
      if (o) {
        html = '<div class="say"><div class="card">' +
          '<div class="drv-label"><span lang="vi">Cho tôi một</span> <i>«чо той мот» — дайте мне одну порцию</i></div>' +
          '<div class="vi" lang="vi">' + esc(o.vi) + '</div>' +
          '<div class="ord-extra" lang="vi" id="ordExtra"' + (orderNoSpicy ? '' : ' hidden') + '>Không cay</div>' +
          '<div class="ru" style="margin-top:12px">' + esc(o.ru) + (orderNoSpicy ? ', без острого' : '') + '</div></div>' +
          '<label class="toggle"><input type="checkbox" id="ordNoSpicy"' + (orderNoSpicy ? ' checked' : '') + '> без острого — «không cay», «хонг кай»</label>' +
          '<div class="hint">покажите экран официанту</div></div>';
      }
    } else if (/^say:/.test(id)) {
      var ph = ALL[+id.slice(4)];
      if (!ph) { html = '<p class="empty">Загружаем фразы…</p>'; }
      else {
        var canSpeak = !!viVoice();
        html = '<div class="say"><div class="card"><div class="vi" lang="vi">' + esc(ph[0]) + '</div>' +
          '<div class="tr">«' + esc(ph[1]) + '»</div><div class="ru">' + esc(ph[2]) + '</div></div>' +
          (canSpeak ? '<button class="speak" type="button" data-act="speak"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2A28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>Послушать</button>' : '') +
          '<div class="hint">покажите экран собеседнику</div></div>';
      }
    } else if (id === 'cities') {
      html = '<h2>Город</h2><p>Начинаем с Нячанга, следом — остальные.</p><div class="list">' +
        CITIES.map(function(c){
          return '<div class="row"><span class="t"><b>' + esc(c.name) + '</b></span><span class="mark">' + (c.on ? 'вы здесь' : 'скоро') + '</span></div>';
        }).join('') + '</div>';
    } else if (id === 'more') {

    if (act === 'locate') locate();
    if (act === 'route' && p) openLink('https://www.google.com/maps/dir/?api=1&destination=' + p.lat + ',' + p.lon);
    if (act === 'show-driver' && p) { driverText = p; go('driver'); }
    if (act === 'route-osm' && osmSel) openLink('https://www.google.com/maps/dir/?api=1&destination=' + osmSel.lat + ',' + osmSel.lon);
    if (act === 'show-driver-osm' && driverText) go('driver');
    if (act === 'drv-maps' && driverText) openLink('https://www.google.com/maps/search/?api=1&query=' + driverText.lat + ',' + driverText.lon);
    if (act === 'drv-copy' && driverText) {
      var t = [driverText.nameVi || driverText.name, driverText.addr, driverText.lat ? driverText.lat.toFixed(5) + ', ' + driverText.lon.toFixed(5) : ''].filter(Boolean).join('\n');
      var done = function(){ haptic('light'); a.textContent = 'Скопировано'; setTimeout(function(){ a.textContent = 'Скопировать адрес'; }, 1600); };
      try { navigator.clipboard.writeText(t).then(done, function(){}); } catch(err){}
    }
  });
  var driverText = null;

  // ================= Еда =================
  var FOOD = null, foodLoading = false, foodScroll = 0, orderNoSpicy = false;
  function loadFood(){
    if (FOOD || foodLoading) return;
    foodLoading = true;
    getJSON('data/food.json' + B + '&h=' + Math.floor(Date.now() / 36e5), 10000).then(function(d){
      FOOD = d; foodLoading = false;
      var t = stack[stack.length - 1];
      if (t === 'food' || /^(dish|order):/.test(t)) renderPage(t);
    }).catch(function(){
      foodLoading = false;
      var t = stack[stack.length - 1];
      if (t === 'food' || /^(dish|order):/.test(t)) $('pageBody').innerHTML = '<h2>Еда</h2><p class="empty">Нет связи. Откройте раздел, когда появится интернет.</p>' + fallbackBack;
    });
  }
  function chili(n){
    var one = '<svg aria-hidden="true" width="14" height="16" viewBox="0 0 14 16"><path d="M9 3c-1-2 1-3 2-2M9 3c2 1 3 3 2 6-1 4-5 6-9 6 3-2 4-5 4-8 0-2 1-4 3-4z" fill="#C0533A" stroke="#2B2A28" stroke-width="1"/></svg>';
    return '<span class="chili" role="img" aria-label="острота ' + n + ' из 3">' + new Array(n + 1).join(one) + '</span>';
  }
  function illHtml(d){
    return '<span class="fd-ill" aria-hidden="true">' + (d.illus ? '<img src="' + esc(d.illus) + '" alt="" loading="lazy" decoding="async">' :
      '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#C0533A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M9 7l3-4M14 7l2-3"/></svg>') + '</span>';
  }
  document.addEventListener('change', function(e){
    if (e.target.id === 'ordNoSpicy') { orderNoSpicy = e.target.checked; haptic('light'); renderPage(stack[stack.length - 1]); }
  });
  document.addEventListener('click', function(e){
    var a = e.target.closest('[data-act="food-near"]');
    if (a) { mapCat = 'еда'; stack.push('map'); haptic('light'); render(); setTimeout(function(){ if (map) { closeSheet(); drawChips(); drawMarkers(); filterOsm(); } }, 300); }
  });

  // ================= Автообновление =================
  // version.txt хранит номер сборки; перезагружаемся только в безопасный момент — на заставке или на главном,
  // сохраняя все параметры адреса и хэш с данными запуска Telegram
  var newBuild = null;
  function checkVersion(){
    fetch('version.txt?t=' + Date.now(), { cache:'no-store' }).then(function(r){ return r.ok ? r.text() : ''; })
      .then(function(t){ t = (t || '').trim(); if (t && t !== BUILD) { newBuild = t; maybeReload(); } }).catch(function(){});
  }
  function maybeReload(){
    if (!newBuild) return;
    var top = stack[stack.length - 1];
    if (top !== 'splash' && top !== 'home') return;
    var u = new URL(location.href);
    u.searchParams.set('v', newBuild);
    location.replace(u.toString());
  }
  setTimeout(checkVersion, 4000);
  setInterval(checkVersion, 5 * 60e3);
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) return;
    checkVersion();
    // Android ставит видео на паузу при сворачивании — продолжаем
    if (started && !splash.hidden && loopV.paused) loopV.play().catch(function(){});
    if (!screens.home.hidden) loadToday();
  });

  render();
})();
</script>
</body>
</html>
